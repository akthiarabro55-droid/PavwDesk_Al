.m.bot{background:var(--glass);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-self:stretch;animation:in .3s}

.card em{font-style:normal;font-size:22px}.card b{display:block;font-size:14px;margin-top:4px}.card small{color:var(--mut);font-size:12px}

0a0b14}.dp-c.sel small{color:#4a4d66}#log>*{flex-shrink:0}.m{overflow-wrap:anywhere;text-shadow:0 1px 2px rgba(0,0,0,.4)}.m.bot{color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.04)),rgba(18,20,44,.6)}.wh{position:relative;display:flex;gap:6px;height:120px}.wh .band{position:absolute;left:0;right:0;top:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid var(--line);pointer-events:none}.col{position:relative;height:120px;overflow-y:auto;scroll-snap-type:y mandatory;padding:40px 0;scrollbar-width:none;text-align:center;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}.col::-webkit-scrollbar{display:none}.col:focus-visible{outline:2px solid var(--b);border-radius:12px}.it{height:40px;line-height:40px;scroll-snap-align:center;font-size:16px;cursor:pointer}.dp .go{all:unset;cursor:pointer;display:block;text-align:center;margin-top:10px;padding:11px;border-radius:12px;background:var(--grad);font-weight:600}.dp .go:focus-visible{outline:2px solid var(--b);outline-offset:2px}.dp .err{color:#fb7185;font-size:12.5px;margin-top:6px}.av:has(img.lg){border-radius:14px;background:#fff!important}.av img.lg{border-radius:12px;object-fit:contain;padding:2px}.top{flex-wrap:wrap}.logo{margin-right:auto}.tabs button{white-space:nowrap}.snd{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:15px}.snd:focus-visible{outline:2px solid var(--b);outline-offset:2px}.av i{font-style:normal}.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}.cal{align-self:stretch;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px;animation:in .3s}.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:14px}.cal-h button{all:unset;cursor:pointer;width:30px;height:30px;text-align:center;border-radius:50%;background:var(--glass)}.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}.cal-g span{color:var(--mut);font-size:11px}.cal-g button{all:unset;cursor:pointer;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;transition:.2s}.cal-g button:hover{background:var(--a)}.cal-g button.sel{background:#fff;color:#0a0b14}.cal-g button:disabled{opacity:.25;pointer-events:none}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-self:stretch;animation:in .3s}.times .slot{text-align:center}.slot.sel{background:#fff;color:#0a0b14}.pay{align-self:stretch;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px;animation:in .3s}.pay input{background:#0003;border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--tx);font:inherit;font-size:16px;width:100%}.pay .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay button.go{all:unset;cursor:pointer;text-align:center;padding:12px;border-radius:12px;background:var(--grad);font-weight:600}.pay button.go:disabled{opacity:.5}.pay small{color:var(--mut);font-size:11.5px;text-align:center}.pay .err{color:#fb7185;font-size:12.5px}.pay .pill{text-align:center}.cz{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cz label{font-size:11.5px;color:var(--mut);display:grid;gap:3px}.cz input{background:#0003;border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--tx);font:inherit;font-size:14px;width:100%}.cz input[type=color]{padding:2px;height:36px}

.ft{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}

/* ---------- Chat engine ---------- */
const log=document.getElementById('log'),inp=document.getElementById('in');
let step='service',bk={};
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scroll=()=>log.scrollTop=log.scrollHeight;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let busy=false;

async function say(text,ui){
 busy=true;const t=$('div','m bot typing','<i></i><i></i><i></i>');log.append(t);scroll();
 await wait(550+Math.min(text.length*8,700));t.remove();
 log.append($('div','m bot',text));Snd.recv();if(ui)log.append(ui());scroll();busy=false}
const user=t=>{Snd.send();log.append($('div','m me',esc(t)));scroll()};
const clearUI=()=>log.querySelectorAll('.cards,.row').forEach(e=>e.remove());

const pills=(arr)=>()=>{const r=$('div','row');arr.forEach(([l,fn])=>{const b=$('button','pill',l);b.onclick=()=>{if(busy)return;clearUI();user(l.replace(/^\S+\s/,''));fn()};r.append(b)});return r};
const svcCards=()=>{const g=$('div','cards');SERVICES.forEach(s=>{const c=$('button','card',`<em>${s.icon}</em><b>${s.name}</b><small>$${s.price} · ${s.mins} min</small>`);c.onclick=()=>{if(busy)return;c.classList.add('sel');g.classList.add('done');user(s.name);pickService(s)};g.append(c)});return g};

function days(){const out=[],d=new Date();for(let i=0;out.length<5;i++){const x=new Date(d);x.setDate(d.getDate()+i);if(x.getDay()!==0)out.push({label:i===0?'Today':i===1?'Tomorrow':x.toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'}),i})}return out}
const SLOTS=['9:00 AM','10:30 AM','12:00 PM','2:00 PM','3:30 PM','5:00 PM'];
const taken=(d,s)=>((d*7+SLOTS.indexOf(s)*3)%5===0);

function greet(){step='service';bk={};
 say(`Welcome to ${esc(BRAND.name)}! Tell me what your pet needs, or pick a service below.`,svcCards)}
async function pickService(s){bk.service=s;step='date';
 await say(`${s.name} it is — $${s.price}, about ${s.mins} minutes. Which day works best?`,()=>{const r=$('div','row');days().forEach(d=>{const b=$('button','slot',d.label);b.onclick=()=>{if(busy)return;clearUI();user(d.label);pickDay(d)};r.append(b)});return r})}
async function pickDay(d){bk.day=d;step='time';
 await say(`Here's what's open ${d.label==='Today'||d.label==='Tomorrow'?d.label.toLowerCase():'on '+d.label}:`,()=>{const r=$('div','row');SLOTS.forEach(s=>{const b=$('button','slot'+(taken(d.i,s)?' off':''),s);b.onclick=()=>{if(busy)return;clearUI();user(s);pickTime(s)};r.append(b)});return r})}
async function pickTime(t){bk.time=t;step='name';await say("Perfect. Who should I put the booking under? (your name)")}
async function final(){step='done';
 const b={name:bk.name,service:bk.service.name,price:bk.service.price,when:`${bk.day.label} · ${bk.time}`};Store.addBooking(b);
 busy=true;await wait(500);
 log.append($('div','sum',`<div class="chk">✓</div><b style="font-size:18px">You're booked!</b><dl><dt>Service</dt><dd>${bk.service.name}</dd><dt>When</dt><dd>${b.when}</dd><dt>Name</dt><dd>${esc(bk.name)}</dd><dt>Phone</dt><dd>${esc(bk.phone)}</dd><dt>Email</dt><dd>${esc(bk.email)}</dd><dt>Total</dt><dd>$${b.price}</dd></dl>`));scroll();busy=false;
 say("A confirmation is on its way. Anything else I can help with?",pills([['➕ Book another',()=>{greet()}],['💬 Opening hours',()=>faq('hours')]]));refresh()}

const FAQ={hours:"We're open Mon–Sat, 9 AM–6 PM. Closed Sundays.",price:"Nail Trim $15 · Bath & Brush $40 · Full Groom $65 · Spa Package $95.",where:"We're at 24 Maple Street, next to the park. Free parking out back."};
const faq=async k=>{await say(FAQ[k]);if(step==='service')say("Ready to pick a service?",svcCards)};

async function onText(t){
 if(step==='name'){if(t.length<2)return say("Could you share your name?");bk.name=t;step='phone';return say(`Nice to meet you, ${esc(t.split(' ')[0])}! What's the best phone number for reminders?`)}
 if(step==='phone'){if(t.replace(/\D/g,'').length<7)return say("That number looks too short. Please include the full number.");bk.phone=t;step='email';return say("And your email for the confirmation?")}
 if(step==='email'){if(!/^\S+@\S+\.\S+$/.test(t))return say("That email doesn't look right. Try something like name@email.com.");bk.email=t;return final()}
 const l=t.toLowerCase();
 if(/hour|open|close/.test(l))return faq('hours');
 if(/price|cost|how much|\$/.test(l))return faq('price');
 if(/where|address|locat|park/.test(l))return faq('where');
 const s=SERVICES.find(s=>s.kw.some(k=>l.includes(k)));
 if(s&&(step==='service'||step==='date'||step==='time')){clearUI();return pickService(s)}
 if(/book|appointment|schedule|yes|ok/.test(l)&&step==='service')return say("Great, choose a service:",svcCards);
 say("I can book grooming, baths, nail trims and spa days, or answer questions about hours, prices and location.",pills([['✂️ Book now',()=>say("Choose a service:",svcCards)],['💲 Prices',()=>faq('price')],['🕘 Hours',()=>faq('hours')]]))}

document.getElementById('f').onsubmit=e=>{e.preventDefault();const t=inp.value.trim();if(!t||busy)return;inp.value='';clearUI();user(t);onText(t)};

function refresh(){const s=Store.s,rev=s.bookings.reduce((a,b)=>a+b.price,0);
 document.getElementById('kpis').innerHTML=[['Total leads',s.leads],['Conversion',Math.round(s.leads/s.sessions*100)+'%'],['Revenue','$'+rev]].map(([a,b])=>`<div class="k"><small>${a}</small><b>${b}</b></div>`).join('');
 const m=Math.max(...s.weekly),dn=['M','T','W','T','F','S','S'];
 document.getElementById('bars').innerHTML=s.weekly.map((v,i)=>{const h=v/m*60;return `<rect x="${i*40+8}" y="${68-h}" width="24" height="${h}" rx="6" fill="url(#gr)"/><text x="${i*40+20}" y="86" fill="#9a9db8" font-size="10" text-anchor="middle">${dn[i]}</text><text x="${i*40+20}" y="${63-h}" fill="#f1f2fa" font-size="10" text-anchor="middle">${v}</text>`}).join('')+'<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>';

/* ---------- Interactive calendar + time picker (overrides the earlier day pills) ---------- */
async function pickService(s){bk.service=s;step='date';await say(`${s.name}: $${s.price}, about ${s.mins} min. Pick a date:`,()=>calendar(new Date()))}
function calendar(view){const w=$('div','cal'),t0=new Date();t0.setHours(0,0,0,0);
 const draw=()=>{const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),cur=y*12+m<=t0.getFullYear()*12+t0.getMonth();
  w.innerHTML=`<div class="cal-h"><button type="button" id="pv" aria-label="Previous month">‹</button>${view.toLocaleDateString('en',{month:'long',year:'numeric'})}<button type="button" id="nx" aria-label="Next month">›</button></div><div class="cal-g">${'SMTWTFS'.split('').map(d=>`<span>${d}</span>`).join('')}${'<i></i>'.repeat(first)}${Array.from({length:n},(_,i)=>{const d=new Date(y,m,i+1);return `<button type="button" data-d="${i+1}" ${d<t0||d.getDay()===0?'disabled':''}>${i+1}</button>`}).join('')}</div>`;
  w.querySelector('#pv').onclick=()=>{if(!cur){view=new Date(y,m-1,1);draw()}};
  w.querySelector('#nx').onclick=()=>{view=new Date(y,m+1,1);draw()};
  w.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(busy)return;b.classList.add('sel');w.style.pointerEvents='none';const d=new Date(y,m,+b.dataset.d),i=Math.round((d-t0)/864e5),label=i===0?'Today':i===1?'Tomorrow':d.toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'});user(label);pickDay({label,i})})};
 draw();return w}
async function pickDay(d){bk.day=d;step='time';await say(`Open times ${d.i<2?d.label.toLowerCase():'on '+d.label}:`,()=>{const g=$('div','times');SLOTS.forEach(s=>{const b=$('button','slot'+(taken(d.i,s)?' off':''),s);b.type='button';b.onclick=()=>{if(busy)return;b.classList.add('sel');g.style.pointerEvents='none';user(s);pickTime(s)};g.append(b)});return g})}

 w.querySelector('#skip').onclick=()=>{w.remove();user('Pay in store');finish(null)};
 w.onsubmit=async e=>{e.preventDefault();const err=w.querySelector('.err'),[mm,yy]=f.exp.value.split('/');err.textContent='';
  if(!luhn(f.num.value))return err.textContent='Enter a valid card number.';
  if(!(+mm>=1&&+mm<=12&&yy&&yy.length===2))return err.textContent='Enter expiry as MM/YY.';
  if(f.cvc.value.length<3)return err.textContent='Enter the 3 or 4 digit CVC.';
  const go=w.querySelector('.go');go.disabled=true;go.textContent='Processing…';
  try{const r=await Gateway.charge({amount:dep,card:{num:f.num.value}});w.remove();user(`Paid $${dep} · •••• ${r.last4}`);finish(r)}catch(x){Snd.err();err.textContent=x.message;go.disabled=false;go.textContent=`Pay $${dep} deposit`}};
 return w}
function finish(r){step='done';const paid=!!r,b={name:bk.name,service:bk.service.name,price:bk.service.price,when:`${bk.day.label} · ${bk.time}`,paid,dep:paid?bk.dep:0};Store.addBooking(b);busy=true;
 wait(400).then(()=>{Snd.ok();log.append($('div','sum',`<div class="chk">✓</div><b style="font-size:18px">You're booked!</b><dl><dt>Service</dt><dd>${bk.service.name}</dd><dt>When</dt><dd>${b.when}</dd><dt>Name</dt><dd>${esc(bk.name)}</dd><dt>Phone</dt><dd>${esc(bk.phone)}</dd><dt>Email</dt><dd>${esc(bk.email)}</dd><dt>Payment</dt><dd>${paid?'$'+b.dep+' deposit paid':'Pay in store'}</dd><dt>Balance due</dt><dd>$${b.price-b.dep}</dd>${paid?`<dt>Receipt</dt><dd>${r.id}</dd>`:''}</dl>`));scroll();busy=false;say('A confirmation is on its way. Anything else?',pills([['➕ Book another',()=>greet()],['🕘 Opening hours',()=>faq('hours')]]));refresh()})}

/* ---------- Client dashboard (overrides the earlier version) ---------- */
function refresh(){const s=Store.s,dn=['M','T','W','T','F','S','S'],m=Math.max(...s.weekly);
 document.getElementById('kpis').innerHTML=[['Total leads',s.leads],['Conversion',Math.round(s.booked/s.leads*100)+'%'],['Online revenue','$'+s.revenue]].map(([a,b])=>`<div class="k"><small>${a}</small><b>${b}</b></div>`).join('');
 document.getElementById('fun').innerHTML=[['Chats started',s.sessions],['Leads captured',s.leads],['Bookings',s.booked],['Deposits paid',s.paid]].map(([l,v])=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;margin:6px 0 3px"><span>${l}</span><span>${v}</span></div><div style="height:8px;border-radius:9px;background:#fff1"><div style="height:100%;width:${Math.min(100,v/s.sessions*100)}%;border-radius:9px;background:var(--grad)"></div></div>`).join('');
 document.getElementById('bars').innerHTML=s.weekly.map((v,i)=>{const h=v/m*60;return `<rect x="${i*40+8}" y="${68-h}" width="24" height="${h}" rx="6" fill="url(#gr)"/><text x="${i*40+20}" y="86" fill="#9a9db8" font-size="10" text-anchor="middle">${dn[i]}</text><text x="${i*40+20}" y="${63-h}" fill="#f1f2fa" font-size="10" text-anchor="middle">${v}</text>`}).join('')+'<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>';
 document.getElementById('recent').innerHTML=s.bookings.slice(0,6).map(b=>`<div class="li"><div>${esc(b.name)}<small>${esc(b.service)} · ${esc(b.when)}</small></div><span class="tag">${b.paid===false?'Pay in store':'$'+(b.dep||Math.round(b.price*.2))+' paid'}</span></div>`).join('')}

/* ---------- Branding controls ---------- */
[['bn','name'],['bv','avatar'],['c1','c1'],['c2','c2']].forEach(([id,k])=>{const el=document.getElementById(id);el.value=BRAND[k];el.oninput=()=>{BRAND[k]=el.value||BRAND[k];try{localStorage.setItem('lr_brand4',JSON.stringify(BRAND))}catch(e){}renderHd()}});
/* Scrolling date selector: replaces the month-grid calendar (hoisted override) */
function calendarStrip(){const w=$('div','dp'),t0=new Date();t0.setHours(0,0,0,0);
 w.innerHTML='<div class="dp-h"><span>Choose a date</span><div><button type="button" aria-label="Earlier dates">‹</button><button type="button" aria-label="Later dates">›</button></div></div>';
 const s=$('div','dp-s'),[pv,nx]=w.querySelectorAll('button');
 pv.onclick=()=>s.scrollBy({left:-180,behavior:'smooth'});nx.onclick=()=>s.scrollBy({left:180,behavior:'smooth'});
 for(let k=0,n=0;n<21;k++){const d=new Date(t0);d.setDate(t0.getDate()+k);if(d.getDay()===0)continue;n++;
  const label=k===0?'Today':k===1?'Tomorrow':d.toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'});
  const b=$('button','dp-c',`<small>${d.toLocaleDateString('en',{weekday:'short'})}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('en',{month:'short'})}</small>`);
  b.type='button';b.onclick=()=>{if(busy)return;b.classList.add('sel');w.style.pointerEvents='none';user(label);pickDay({label,i:k})};s.append(b)}
 w.append(s);return w}
/* Wheel selector for day / month / year: replaces the date strip (hoisted override) */
function calendar(){const IT=40,now=new Date();now.setHours(0,0,0,0);
 const w=$('div','dp','<div class="dp-h"><span>Choose a date</span><b id="dsum"></b></div>'),wh=$('div','wh','<i class="band"></i>');
 const S={d:now.getDate(),m:now.getMonth(),y:now.getFullYear()},Y=[S.y,S.y+1];
 const MS=Array.from({length:12},(_,i)=>new Date(2000,i,1).toLocaleDateString('en',{month:'long'}));
 const dsum=w.querySelector('#dsum'),err=$('div','err'),go=$('button','go','Confirm date');go.type='button';
 const upd=()=>dsum.textContent=new Date(S.y,S.m,S.d).toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'});
 const mk=(items,flex,cb)=>{const c=$('div','col');c.style.flex=flex;c.tabIndex=0;let tm;
  c.fill=a=>{c.innerHTML=a.map(t=>`<div class="it">${t}</div>`).join('');c.n=a.length};c.fill(items);
  c.onscroll=()=>{clearTimeout(tm);tm=setTimeout(()=>cb(Math.max(0,Math.min(c.n-1,Math.round(c.scrollTop/IT)))),80)};
  c.onclick=e=>{const i=[...c.children].indexOf(e.target);if(i>=0)c.scrollTo({top:i*IT,behavior:'smooth'})};
  c.go=i=>{c.scrollTop=i*IT};return c};
 const dim=()=>new Date(S.y,S.m+1,0).getDate(),days=()=>Array.from({length:dim()},(_,i)=>i+1);
 const cd=mk(days(),.8,i=>{S.d=i+1;upd()}),
  cm=mk(MS,1.6,i=>{S.m=i;fix()}),cy=mk(Y,1,i=>{S.y=Y[i];fix()});
 function fix(){const n=dim();if(cd.n!==n)cd.fill(days());if(S.d>n){S.d=n;cd.go(n-1)}upd()}
 wh.append(cd,cm,cy);w.append(wh,err,go);upd();
 setTimeout(()=>{cd.go(S.d-1);cm.go(S.m);cy.go(0)},80);
 go.onclick=()=>{if(busy)return;const d=new Date(S.y,S.m,S.d);err.textContent='';
  if(d<now)return err.textContent='That date has passed. Pick today or later.';
  if(d.getDay()===0)return err.textContent="We're closed on Sundays. Pick another day.";
  const i=Math.round((d-now)/864e5),label=i===0?'Today':i===1?'Tomorrow':d.toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric',...(S.y!==now.getFullYear()&&{year:'numeric'})});
  w.style.pointerEvents='none';go.textContent='✓ '+label;user(label);pickDay({label,i})};
 return w}
const sb=document.getElementById('snd'),ic=()=>{sb.textContent=Snd.on?'🔊':'🔇';sb.setAttribute('aria-pressed',Snd.on)};sb.onclick=()=>{Snd.toggle();ic()};ic();
refresh();renderHd();greet();
</script></body></html>
